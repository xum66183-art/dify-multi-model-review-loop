name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate YAML and JSON files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          yaml_files = sorted([*Path(".").rglob("*.yml"), *Path(".").rglob("*.yaml")])
          json_files = sorted(Path(".").rglob("*.json"))

          for path in yaml_files:
              with path.open("r", encoding="utf-8") as file:
                  yaml.safe_load(file)
              print(f"Valid YAML: {path}")

          for path in json_files:
              with path.open("r", encoding="utf-8") as file:
                  json.load(file)
              print(f"Valid JSON: {path}")

          print(f"Validated {len(yaml_files)} YAML file(s) and {len(json_files)} JSON file(s).")
          PY

      - name: Check required project structure
        shell: bash
        run: |
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -d workflows
          test -d prompts
          test -d examples
          test -d docs
          test -f workflows/basic-review-loop.yml
          test -f prompts/generator.md
          test -f prompts/reviewer.md
